name: Release

# Pushing a version tag like v1.0.0 builds the desktop app for Windows, macOS and Linux,
# checks that each one starts, signs every file with Sigstore (keyless, via GitHub OIDC)
# with SLSA build provenance, and publishes them together as a GitHub release. Tags with a
# suffix (e.g. v1.1.0-beta.1) are marked as betas ("pre-release" on GitHub).
#
# Manual runs and PRs that touch packaging only build and check (and, for manual runs,
# sign): they never publish anything.
#
# File names don't include the version, so the website can link to
# releases/latest/download/<file> (see website/src/pages/download.tsx):
#   FlyBudget-Windows-Setup.exe
#   FlyBudget-macOS-arm64.dmg, FlyBudget-macOS-x64.dmg
#   FlyBudget-Linux-x86_64.AppImage, FlyBudget-Linux-arm64.AppImage
#   FlyBudget-Linux-amd64.deb, FlyBudget-Linux-arm64.deb
#
# Verify a download with:
#   gh attestation verify FlyBudget-Windows-Setup.exe -R dtymoszenko/FlyBudget

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron-builder.json
      - electron/**

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            files: dist-electron/*.exe
            app: dist-electron/win-unpacked/FlyBudget.exe
          - os: macos-latest # Apple Silicon; builds the Intel version too
            name: macos
            files: dist-electron/*.dmg
            app: dist-electron/mac-arm64/FlyBudget.app/Contents/MacOS/FlyBudget
          - os: ubuntu-latest
            name: linux
            files: |
              dist-electron/*.AppImage
              dist-electron/*.deb
            app: dist-electron/linux-unpacked/flybudget
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 like CI: Node 22's npm 10 can't verify newer package attestations
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server

      - name: Build the app
        run: npm run electron:build -- --publish never
        env:
          # No paid code-signing certificates (Windows Authenticode, Apple Developer ID):
          # don't let electron-builder look for them. macOS builds are ad-hoc signed
          # (electron-builder.json), which Apple Silicon requires to run at all.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Sign pull request builds the same way (ad-hoc on macOS), so they test what ships
          CSC_FOR_PULL_REQUEST: 'true'

      # Start the packaged app and wait for its built-in server to answer, so a release can't
      # ship an app that doesn't start (a missing native module, a broken fuse or asar).
      - name: Allow Electron's sandbox on the Linux runner
        if: matrix.name == 'linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
        # Installing the .deb sets up the sandbox helper instead (see the install guide).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check that the app starts
        shell: bash
        env:
          APP: ${{ matrix.app }}
          RUN: ${{ matrix.name == 'linux' && 'xvfb-run -a' || '' }}
        run: |
          $RUN "$APP" > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:58342/api/health | grep -q '"ok"'; then
              echo "FlyBudget started"
              exit 0
            fi
            sleep 2
          done
          echo "FlyBudget didn't start within two minutes:"
          cat app.log
          exit 1
      - name: Stop the app
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) taskkill //F //IM FlyBudget.exe || true ;;
            macOS) pkill -f FlyBudget.app || true ;;
            Linux) pkill -f linux-unpacked/flybudget || true ;;
          esac

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}

      # Ship the signed attestation next to each file: the full Sigstore bundle
      # (.sigstore.json) and its DSSE-signed in-toto provenance (.intoto.jsonl).
      - name: Write signature and provenance files
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for file in dist-electron/*.exe dist-electron/*.dmg dist-electron/*.AppImage dist-electron/*.deb; do
            [ -f "$file" ] || continue
            cp "$BUNDLE" "$file.sigstore.json"
            node -e "const b=require(process.argv[1]); process.stdout.write(JSON.stringify(b.dsseEnvelope)+'\n')" "$BUNDLE" > "$file.intoto.jsonl"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            dist-electron/*.sigstore.json
            dist-electron/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          path: release
          merge-multiple: true

      # One file with every download's SHA-256, for people who check downloads that way
      - name: Write checksums
        working-directory: release
        run: sha256sum FlyBudget-* | grep -v -e '\.sigstore\.json' -e '\.intoto\.jsonl' > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "FlyBudget $TAG")
          # v1.0.0 → normal release; tags with a suffix (v1.1.0-beta.1) → marked as a beta
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
