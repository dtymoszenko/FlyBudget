name: Release

# Pushing a version tag like v1.0.0 builds the Windows installer, signs it with
# Sigstore (keyless, via GitHub OIDC), attaches SLSA build provenance, and
# publishes a GitHub release. Tags with a suffix (e.g. v1.1.0-beta.1) are marked
# as betas ("pre-release" on GitHub).
#
# Manual runs and PRs that touch packaging only build (and, for manual runs,
# sign) — they never publish anything.
#
# Verify a downloaded installer with:
#   gh attestation verify FlyBudget-Setup-<version>.exe -R dtymoszenko/FlyBudget

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron-builder.json
      - electron/**

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server

      - name: Build installer
        run: npm run electron:build -- --publish never
        env:
          # No Authenticode certificate — don't let electron-builder look for one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-electron/*.exe

      # Ship the signed attestation next to the installer: the full Sigstore bundle
      # (.sigstore.json) and its DSSE-signed in-toto provenance (.intoto.jsonl).
      - name: Write signature and provenance files
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for exe in dist-electron/*.exe; do
            cp "$BUNDLE" "$exe.sigstore.json"
            node -e "const b=require(process.argv[1]); process.stdout.write(JSON.stringify(b.dsseEnvelope)+'\n')" "$BUNDLE" > "$exe.intoto.jsonl"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.sigstore.json
            dist-electron/*.exe.intoto.jsonl
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: installer

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "FlyBudget $TAG")
          # v1.0.0 → normal release; tags with a suffix (v1.1.0-beta.1) → marked as a beta
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" installer/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
