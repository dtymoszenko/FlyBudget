name: Docker

# Builds the self-hosted server image (Dockerfile) and smoke-tests the running
# container on every PR and push to main. Pushing a version tag like v1.0.0 also
# publishes it for amd64 and arm64 to ghcr.io/dtymoszenko/flybudget, with signed
# SLSA build provenance.
#
# Tags: the exact version (0.2.0, 0.2.0-beta.1), major.minor for stable releases,
# and "latest" for stable releases (and every release before 1.0).
#
# Verify an image with:
#   gh attestation verify oci://ghcr.io/dtymoszenko/flybudget:<version> -R dtymoszenko/FlyBudget

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/dtymoszenko/flybudget

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: flybudget:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run it the way docker-compose.yml does (read-only, no capabilities,
      # key from a secret file) and check that login protects the data
      - name: Smoke test
        run: |
          set -euo pipefail
          openssl rand -base64 32 > "$RUNNER_TEMP/key.txt"
          chmod 644 "$RUNNER_TEMP/key.txt"
          docker run -d --name flybudget -p 3001:3001 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/key.txt:/run/secrets/key:ro" \
            -e FLYBUDGET_DATA_KEY_FILE=/run/secrets/key \
            flybudget:test

          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          echo

          expect() { # expect <status> <curl args…>
            local want=$1; shift
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$got $*"
            [ "$got" = "$want" ] || { echo "::error::expected $want, got $got: $*"; exit 1; }
          }
          J=(-H 'Origin: http://localhost:3001' -H 'Content-Type: application/json')
          URL=http://localhost:3001

          test "$(docker exec flybudget id -u)" = 1000
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":true'
          expect 401 $URL/api/accounts
          expect 200 $URL/budget
          expect 403 -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            -d '{"password":"correct horse battery"}' $URL/api/auth/setup
          expect 204 -c cookies "${J[@]}" -d '{"password":"correct horse battery"}' $URL/api/auth/setup
          expect 409 "${J[@]}" -d '{"password":"another password"}' $URL/api/auth/setup
          expect 200 -b cookies $URL/api/accounts
          expect 401 "${J[@]}" -d '{"password":"wrong password"}' $URL/api/auth/login
          expect 204 -b cookies "${J[@]}" -X POST $URL/api/auth/logout
          expect 401 -b cookies $URL/api/accounts

          # Data survives a restart
          docker restart flybudget
          for i in $(seq 1 30); do
            curl -sf $URL/api/health > /dev/null && break
            sleep 1
          done
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":false'

          # Health check reports healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' flybudget)" != unhealthy

      - name: Container logs
        if: always()
        run: docker logs flybudget || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore keyless signing of the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=FlyBudget
            org.opencontainers.image.description=Self-hosted FlyBudget server
            org.opencontainers.image.licenses=GPL-3.0

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
