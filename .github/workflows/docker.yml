name: Docker

# Builds the self-hosted server image (Dockerfile) and smoke-tests the running
# container on every PR and push to main. Pushing a version tag like v1.0.0 also
# publishes it for amd64 and arm64 to ghcr.io/dtymoszenko/flybudget, with signed
# SLSA build provenance.
#
# Tags: the exact version (0.2.0, 0.2.0-beta.1), major.minor for stable releases,
# and "latest" for stable releases (and every release before 1.0).
#
# Images are also scanned for known vulnerabilities (Grype) on main, on tags and
# weekly; results appear under Security → Code scanning.
#
# Verify an image with:
#   gh attestation verify oci://ghcr.io/dtymoszenko/flybudget:<version> -R dtymoszenko/FlyBudget

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vulnerability scan of the image

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/dtymoszenko/flybudget

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the vulnerability scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # The name docker-compose.yml uses, so the test below runs this build
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it with the real docker-compose.yml (read-only, no capabilities, key
      # from a Docker secret) and check that the login protects the data
      - name: Smoke test
        run: |
          set -euo pipefail
          # The key setup from the self-hosting guide
          openssl rand -base64 32 > flybudget_data_key.txt
          sudo chown 1000:1000 flybudget_data_key.txt
          sudo chmod 400 flybudget_data_key.txt
          # --wait also requires the image's health check to report healthy
          docker compose up -d --wait --wait-timeout 180

          expect() { # expect <status> <curl args…>
            local want=$1; shift
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$got $*"
            [ "$got" = "$want" ] || { echo "::error::expected $want, got $got: $*"; exit 1; }
          }
          J=(-H 'Origin: http://localhost:3001' -H 'Content-Type: application/json')
          URL=http://localhost:3001
          PASSWORD='{"password":"correct horse battery"}'
          # The setup code the server prints to its log
          setup_code() { docker compose logs | grep -oE '[A-Z2-9]{4}(-[A-Z2-9]{4}){3}' | tail -1; }
          setup_body() { printf '{"password":"correct horse battery","setupCode":"%s"}' "$(setup_code)"; }

          test "$(docker exec flybudget id -u)" = 1000
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":true'
          expect 401 $URL/api/accounts
          expect 200 $URL/budget
          expect 403 -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            -d "$(setup_body)" $URL/api/auth/setup
          # Without the setup code from the log, nobody can claim the server
          expect 403 "${J[@]}" -d "$PASSWORD" $URL/api/auth/setup
          expect 204 -c cookies "${J[@]}" -d "$(setup_body)" $URL/api/auth/setup
          expect 409 "${J[@]}" -d '{"password":"another password"}' $URL/api/auth/setup
          expect 201 -b cookies "${J[@]}" \
            -d '{"name":"Checking","type":"checking","startingBalance":12345}' $URL/api/accounts
          expect 401 "${J[@]}" -d '{"password":"wrong password"}' $URL/api/auth/login
          expect 204 -b cookies "${J[@]}" -X POST $URL/api/auth/logout
          expect 401 -b cookies $URL/api/accounts

          # Data and password survive recreating the container (docker compose pull/up)
          docker compose up -d --wait --wait-timeout 180 --force-recreate
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":false'
          expect 204 -c cookies "${J[@]}" -d "$PASSWORD" $URL/api/auth/login
          curl -sf -b cookies $URL/api/accounts | grep -q '"Checking"'

          # The backup command from the self-hosting guide
          docker exec flybudget node backup.cjs
          docker cp flybudget:/data/backups ./backups
          python3 -c "import glob, sqlite3; db = sqlite3.connect(glob.glob('backups/*.db')[0]); assert db.execute('SELECT name FROM accounts').fetchall() == [('Checking',)]"

          # The password reset command from the guide
          docker exec flybudget node reset-password.cjs
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":true'
          expect 401 -b cookies $URL/api/accounts

          # The restore steps from the guide bring back the data and the password
          docker compose stop
          docker run --rm --volumes-from flybudget -v "$PWD/backups":/backups alpine \
            sh -c 'rm -f /data/budget.db-wal /data/budget.db-shm && cp /backups/*.db /data/budget.db && chown 1000:1000 /data/budget.db'
          docker compose start
          docker compose up -d --wait --wait-timeout 180
          curl -sf $URL/api/auth/status | grep -q '"needsSetup":false'
          expect 204 -c cookies "${J[@]}" -d "$PASSWORD" $URL/api/auth/login
          curl -sf -b cookies $URL/api/accounts | grep -q '"Checking"'

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Scan for vulnerabilities
        id: scan
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:latest
          fail-build: false
          only-fixed: true
          output-format: sarif

      - name: Upload scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: docker-image

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore keyless signing of the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=FlyBudget
            org.opencontainers.image.description=Self-hosted FlyBudget server
            org.opencontainers.image.licenses=GPL-3.0

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Release images are built from scratch (no shared build cache that a
          # PR could have influenced), with an SBOM and full build provenance
          no-cache: true
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
