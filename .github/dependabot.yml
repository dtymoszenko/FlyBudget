version: 2
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/client'
      - '/server'
      - '/e2e'
      - '/website'
    schedule:
      interval: weekly
      day: monday
    # Wait before adopting a new release: hijacked npm releases are usually caught
    # and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # Native / Electron-coupled deps can pass type-checking and still break at
      # runtime, so they get their own PRs and are never auto-merged.
      electron-native:
        patterns:
          - 'electron'
          - 'electron-*'
          - '@electron/*'
          - 'better-sqlite3'
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - 'electron'
          - 'electron-*'
          - '@electron/*'
          - 'better-sqlite3'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # Stay on the Node 24 LTS line; major Node upgrades are done by hand
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
