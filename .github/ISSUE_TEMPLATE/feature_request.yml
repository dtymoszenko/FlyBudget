name: Feature request
description: Suggest something FlyBudget could do, or do better
title: '[Feature Request] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! If you have several, please open one issue for each.

  - type: textarea
    id: problem
    attributes:
      label: What is missing or can be improved in FlyBudget?
      description: The situation in your own budget that led to this idea and how it would help.
      placeholder: I import from two banks and …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like FlyBudget to do?
      description: How you imagine it working, if you have an idea. Sketches are welcome.

  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: How you handle it today (workarounds?), how another app does it, optional demo of the problem if applicable.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (please agree on the approach in this issue first).
