name: Bug report
description: Something in FlyBudget doesn't work as it should
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Found a security problem?** Don't post it here: report it privately as [SECURITY.md](https://github.com/dtymoszenko/FlyBudget/blob/main/SECURITY.md) explains.

        **Don't paste anything private**: bank credentials, access URLs, API keys, the setup code, or real account numbers and transactions. Replace them with placeholders like `<bank>` or `••1234`.

  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way to make it happen again, starting from a page in the app.
      placeholder: |
        1. Go to Transactions
        2. Click …
        3. See …
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How do you run FlyBudget?
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Self-hosted server (Docker)
        - In-browser demo (flybudget.org)
        - From source (npm run dev)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Click the status at the bottom of the sidebar ("On this computer" or your server's address) to see it.
      placeholder: 0.3.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser or device
      description: For the self-hosted server or the demo, the browser you use. Mention it if it only happens on a phone.
      placeholder: Firefox 133 on Android

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in the app it happens (pick any that apply).
      multiple: true
      options:
        - Budget
        - Transactions
        - Accounts or reconciling
        - Importing files (CSV, Excel, CAMT)
        - Bank sync (Plaid)
        - Bank sync (SimpleFIN)
        - Bank sync (Enable Banking)
        - Currencies and exchange rates
        - Recurring
        - Rules
        - Reports or dashboard
        - Goals
        - Payees
        - Settings, backups or export
        - Sign-in or server setup
        - Offline or reconnecting
        - Something else

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: 'The error shown in the app, or the server log around it (Docker: `docker logs <container>`).'
      render: text

  - type: textarea
    id: details
    attributes:
      label: Screenshots and other details
      description: Screenshots, or for imports and bank sync a few anonymized rows of the file and your bank's name.
