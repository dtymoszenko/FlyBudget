# CodeRabbit AI review settings: https://docs.coderabbit.ai/reference/configuration
# Free for this repo because it's public (open source plan). Reviews every PR
# into main; CLAUDE.md is the source of truth for the conventions below.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: 'Be concise and specific. Explain the concrete failure (inputs, state, result) behind each issue. Skip praise and style nits Prettier already handles.'

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    base_branches: ['main']
    # Dependabot bumps are handled by dependabot-auto-merge.yml
    ignore_usernames: ['dependabot[bot]']
    ignore_title_keywords: ['WIP', '[skip review]']

  path_filters:
    - '!**/package-lock.json'
    - '!**/dist/**'
    - '!**/build/**'
    - '!server/src/db/migrations/meta/**' # drizzle snapshots
    - '!server/src/demo/logos.ts' # generated by client/scripts/generate-demo-logos.mjs
    - '!website/static/demo/**' # built by website/scripts/build-demo.mjs
    - '!website/static/img/**'
    - '!electron/resources/**'

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        - Money is integer cents everywhere. Flag parseFloat or float math on amounts; the client converts only with formatCurrency()/parseCents() (client/src/utils/currency.ts).
        - Keep business logic in pure modules (no database or clock access), like rulesEngine.ts and utils/recurrence.ts, with the database side in a separate service.

    - path: 'server/src/routes/**'
      instructions: |
        - Request bodies are validated with Zod before touching the database. Dates use isoDate/isoMonth from utils/validation.ts, never a bare regex.
        - PUT schemas must not be createSchema.partial() when the create schema has .default()s (Zod 4 applies defaults inside .partial() and resets unsent fields). Define the fields without defaults and .partial() that.
        - New transactions go through insertNewTransaction and deletes through deleteTransactionRow (services/transactionHelpers.ts); flag routes that insert or delete transaction rows directly.
        - Never send err.stack or raw exception messages to the client; errors go to errorHandler.
        - A new router must also be mounted in server/src/browser/app.ts (the website demo), and route modules must not import Node-only code (fs, crypto, network) the demo can't load.
        - Every /api route except /api/health and /api/auth/* needs requireSession in server mode. /api/health must stay exactly {"status":"ok"}, and /api/server/info must never return secrets, keys, hashes, tokens or file paths.

    - path: 'server/src/{middleware/**,auth/**,config.ts}'
      instructions: |
        Security-critical: hostGuard, originGuard, apiTokenGuard, sessions, rate limits and the CSP. Check carefully for anything that loosens them, cookie flags (HttpOnly, SameSite=Strict, Secure), timing-safe comparisons, and secrets reaching logs or responses.

    - path: 'server/src/services/**'
      instructions: |
        - Outbound requests to user-supplied URLs (SimpleFIN) must use safeFetch, never fetch.
        - Bank data (Plaid, SimpleFIN) is untrusted: validate with Zod, convert amounts to cents exactly, strip control characters from payee text.
        - Plaid access tokens and link/public tokens never leave the server. Reconciled transactions are never modified by sync.
        - Splits: balances exclude child rows, category/spending totals exclude parents (isParent = 0). Uncategorized adjustment rows are left out of income/spending but count in balances.
        - Text cells in CSV exports go through escapeCsv. New data tables must be added to BACKUP_TABLES; bank credentials, passwords and sessions never go in backups.
        - New generated rows that every device would create the same way (occurrences, default categories) should get a deterministic id from their content rather than nanoid().

    - path: 'server/src/db/**'
      instructions: |
        - Schema changes must be additive (nullable columns, defaults, new tables); flag renames, drops or changed column meanings. Avoid new unique constraints on user-entered text.
        - Columns that hold credentials use the encryptedText type and can't be used in WHERE clauses.
        - drizzle-kit generate proposes dropping the legacy recurring_transactions table; that must not ride along with unrelated migrations.

    - path: 'client/src/**/*.tsx'
      instructions: |
        - Server data uses TanStack Query hooks in client/src/hooks/ whose mutations invalidate affected queries; UI state lives in Zustand.
        - Dialogs fill their fields once per opening with useFormReset, never from an effect depending on query data. Don't default query data to a fresh [] (data: x = []) when an effect copies it into state.
        - Save buttons check useCanSave() and show <SavingPausedHint />. New-transaction buttons use useAddTransaction().
        - Phones (<768px): touch targets at least 44px (max-md:min-h-11, plus max-md:min-w-11 for icon buttons), no sideways scrolling, phone-only styles under max-md:. Plain <button>s inside forms or pickers need type="button".
        - Prefer accessible names and roles; e2e tests select by role/label. Reuse components/ui (Modal, Button, RowMenu, EmptyState, ExternalLink) and chart helpers in components/reports/ChartHelpers.tsx; every Recharts XAxis uses useXAxisLayout.
        - Nothing may load from a new external origin without updating the CSP (server securityHeaders, the demo <meta> in client/vite.config.ts and website/static/_headers).

    - path: 'client/src/offline/**'
      instructions: |
        The offline copy saves only budget data (OFFLINE_QUERY_KEYS), never auth status, sessions, server info or bank connections, and is deleted on sign-out and 401. Waiting transactions keep their client id so a resend never duplicates. Check IndexedDB writes are atomic and safe across tabs.

    - path: 'electron/**'
      instructions: |
        The window stays sandboxed with no Node in the page, all permission requests denied, no navigation away from the app, and shell.openExternal called only with https: URLs. The per-launch API token and credential key must never reach the renderer except as an HttpOnly cookie.

    - path: '**/*.test.ts'
      instructions: |
        Tests are property-based (Vitest + fast-check): prefer invariants over generated inputs to fixed examples. Server tests must not touch budget.db.

    - path: 'e2e/**'
      instructions: |
        Prefer role/label selectors over CSS selectors. Tests that stop the server (serverControl.ts) must restart it in a finally block.

    - path: '.github/workflows/**'
      instructions: |
        cla.yml runs on pull_request_target: it must never check out or run PR code, or interpolate comment or PR text into a script. Pin actions to commit SHAs and keep permissions minimal.

    - path: 'website/docs/**'
      instructions: |
        User guide pages. File names are linked from the app through docsUrl(); flag renames. Screenshots use <Screenshot name=… />, never Markdown images or <img>.

    - path: '{CLAUDE,AGENTS}.md'
      instructions: |
        CLAUDE.md and AGENTS.md are the same guide for different AI tools; any change to one must be made to the other.

  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: warning
      requirements: 'Conventional commit format: type(optional scope): description, where type is one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.'
    custom_checks:
      - name: Docs updated for user-facing changes
        mode: warning
        instructions: |
          Pass if the PR changes no user-facing behavior, or if it also updates the matching page in website/docs/ (or website/tour/). Fail if a feature visibly changes and no guide page is touched.
      - name: CLAUDE.md and AGENTS.md in sync
        mode: warning
        instructions: |
          Pass if neither CLAUDE.md nor AGENTS.md is changed, or both are changed with the same content change. Fail if only one of them is changed.

  tools:
    eslint:
      enabled: false # the repo has no ESLint config; tsc and Prettier run in CI
    biome:
      enabled: false
    oxc:
      enabled: false
    squawk:
      enabled: false # Postgres-only; migrations are SQLite
    sqlfluff:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns: ['CLAUDE.md'] # AGENTS.md is the same guide
  learnings:
    scope: local
